<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon portfolio - Contact</title>
    <link rel="icon" type="image/svg+xml" href="image/Logo_ulco.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- En-tête du site -->
    <header>        
        <div class="header-gauche">
            <a href="index.html">
                <img src="image/Logo_ulco.svg" alt="Logo de l'ULCO" class="logo_ulco">
            </a>
            <h1>Lachaire Louis - Mon portfolio</h1>
        </div>
        <a href="https://www.univ-littoral.fr" target="_blank" rel="noopener noreferrer">
        <img src="image/ulco_batiment.avif" alt="Bâtiment de l'ULCO" class="batiment_ulco">
        </a>
    </header>

    <!-- Menu de navigation principal -->
    <nav> 
        <ul class="menu-navigation">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="cv.html">Mon CV</a></li>
            <li><a href="cours.html">Cours</a></li>
            <li><a href="projets.html">Projets</a></li>
            <li><a href="a-propos.html">À propos</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- Contenu principal -->
    <main>
        <div class="conteneur-contact">
            <h2>Me contacter</h2>
            <p>Vous avez une question, un projet ou une remarque ? N'hésitez pas à m'envoyer un message via le formulaire ci-dessous.</p>

            <form action="#" method="POST" class="formulaire-contact">
                <div class="groupe-champ">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required placeholder="Votre nom">
                </div>

                <div class="groupe-champ">
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" required placeholder="votre.email@etu.univ-littoral.fr">
                </div>

                <div class="groupe-champ">
                    <label for="message">Message :</label>
                    <textarea id="message" name="message" rows="6" required placeholder="Écrivez votre message ici..."></textarea>
                </div>

                <button type="submit" class="btn-envoyer">Envoyer le message</button>
            </form>
        </div>
    </main>

</body>
</html>
